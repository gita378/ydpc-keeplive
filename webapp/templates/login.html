{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card p-4">
            <h4 class="text-center mb-3">管理员登录</h4>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">用户名</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">密码</label>
                    <div class="input-group">
                        <input type="password" name="password" autocomplete="current-password" class="form-control" required>
                        <button type="button" class="btn btn-outline-secondary toggle-pwd">👁</button>
                    </div>
                </div>
                {% if need_captcha and captcha %}
                <div class="mb-3">
                    <label class="form-label">验证码</label>
                    {% if captcha.image %}
                    <div class="mb-2">
                        <img src="{{ captcha.image }}" alt="验证码" style="height:60px;border-radius:4px;border:1px solid #ddd">
                    </div>
                    <input type="text" name="captcha" class="form-control" placeholder="请输入图中的数字" required>
                    {% else %}
                    <div class="mb-2"><strong>{{ captcha.text }}</strong></div>
                    <input type="text" name="captcha" class="form-control" placeholder="请输入计算结果" required>
                    {% endif %}
                </div>
                {% endif %}
                <button type="submit" class="btn btn-primary w-100">登录</button>
            </form>
            <p class="text-muted text-center mt-3 small">默认: admin / admin123</p>
        </div>
    </div>
</div>
{% endblock %}
