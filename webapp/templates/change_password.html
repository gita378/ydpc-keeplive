{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h4 class="mb-3">修改管理员账号</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">用户名</label>
                    <input type="text" name="new_username" class="form-control" value="{{ admin_username }}" required>
                </div>
                <hr>
                <div class="mb-3">
                    <label class="form-label">当前密码</label>
                    <input type="password" name="old_password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">新密码 <small class="text-muted">（不改则留空）</small></label>
                    <input type="password" name="new_password" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">确认新密码</label>
                    <input type="password" name="confirm_password" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary">保存</button>
                <a href="{{ url_for('main.index') }}" class="btn btn-secondary ms-2">取消</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
