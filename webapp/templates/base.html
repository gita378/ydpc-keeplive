<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>移动云电脑保活管理</title>
    <script>var csrfToken = document.querySelector('meta[name="csrf-token"]').content;</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .badge-on { background: #28a745; }
        .badge-off { background: #6c757d; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('main.index') }}">☁️ 移动云电脑保活管理</a>
        {% if session.get('admin_logged_in') %}
        <div>
            <a href="{{ url_for('main.index') }}" class="btn btn-outline-light btn-sm me-2">账号管理</a>
            <a href="{{ url_for('main.logs') }}" class="btn btn-outline-light btn-sm me-2">执行日志</a>
            <button id="holdExtendBtn" class="btn btn-sm me-2 {{ 'btn-warning' if hold_extend_enabled else 'btn-outline-light' }}"
                    onclick="toggleHoldExtend()">
                延长保持: {{ '开' if hold_extend_enabled else '关' }}
            </button>
            <a href="{{ url_for('auth.change_password') }}" class="btn btn-outline-light btn-sm me-2">修改密码</a>
            <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light btn-sm">退出</a>
        </div>
        {% endif %}
    </div>
</nav>
<div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for cat, msg in messages %}
    <div class="alert alert-{{ cat }} alert-dismissible fade show">{{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// AJAX 自动带 CSRF token (csrfToken 已在 head 定义)
var _origFetch = window.fetch;
window.fetch = function(url, opts = {}) {
    if (csrfToken && opts.method && opts.method.toUpperCase() === 'POST') {
        opts.headers = Object.assign({'X-CSRFToken': csrfToken}, opts.headers || {});
    }
    return _origFetch(url, opts);
};
// 密码显示/隐藏小眼睛
document.addEventListener('click', function(e) {
    if (e.target.classList.contains('toggle-pwd')) {
        const input = e.target.closest('.input-group').querySelector('input');
        if (input.type === 'password') { input.type = 'text'; e.target.textContent = '🙈'; }
        else { input.type = 'password'; e.target.textContent = '👁'; }
    }
});
// 延长保持时间 测试开关
function toggleHoldExtend() {
    fetch('{{ url_for("main.toggle_hold_extend") }}', {method: 'POST'})
        .then(r => r.json())
        .then(d => {
            alert(d.msg);
            const btn = document.getElementById('holdExtendBtn');
            btn.textContent = '延长保持: ' + (d.enabled ? '开' : '关');
            btn.className = 'btn btn-sm me-2 ' + (d.enabled ? 'btn-warning' : 'btn-outline-light');
        })
        .catch(() => alert('操作失败'));
}
</script>
</body>
</html>
